global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 24h
    timeout server 24h
    timeout tunnel 24h

frontend tls_router
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

    acl linkukai_site req.ssl_sni -i linkukai.com www.linkukai.com
    use_backend linkukai_https if linkukai_site
    default_backend xray_reality

backend linkukai_https
    server linkukai_web 127.0.0.1:8444 check

backend xray_reality
    server xray_local 127.0.0.1:8443 check
