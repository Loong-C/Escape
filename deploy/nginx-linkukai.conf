server {
    listen 80;
    listen [::]:80;
    server_name linkukai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8444 ssl http2;
    server_name linkukai.com;
    root /var/www/linkukai/public;
    absolute_redirect off;

    ssl_certificate /etc/nginx/ssl/linkukai/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/linkukai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:linkukai_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    include /etc/nginx/snippets/escape-security-headers.conf;

    location = /games/Escape {
        return 308 /games/Escape/;
    }

    location = /games/Escape/index.html {
        include /etc/nginx/snippets/escape-security-headers.conf;
        expires -1;
        try_files $uri =404;
    }

    location = /games/Escape/ai/escape-value.json {
        include /etc/nginx/snippets/escape-security-headers.conf;
        expires -1;
        try_files $uri =404;
    }

    location ^~ /games/Escape/assets/ {
        include /etc/nginx/snippets/escape-security-headers.conf;
        expires 1y;
        try_files $uri =404;
    }

    location /games/Escape/ {
        try_files $uri $uri/ /games/Escape/index.html;
    }

    location / {
        return 404;
    }
}
